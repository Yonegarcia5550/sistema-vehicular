<div class="login-container">

  <div class="login-card">

    <img
      src="imagenes/movilidad.png"
      alt="Logo SEMOVI"
      class="logo">

    <h1>SEMOVI</h1>

    <p class="subtitle">
      Bienvenido al portal de la Secretaría de Movilidad del Estado de Oaxaca
    </p>
    <div class="form-group">
      <label for="usuario">Usuario</label>
      <input
        id="usuario"
        type="text"
        [(ngModel)]="username" 
        placeholder="Ingrese su usuario">
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="password" 
        placeholder="Ingrese su contraseña">
    </div>
    
    <button class="btn-login"
      (click)="login()"
      [disabled]="!username || !password">
      Iniciar sesión
    </button>

  </div>

</div>
